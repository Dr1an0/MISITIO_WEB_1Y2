
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Panadería Santa Rosa</title>

    <link rel="stylesheet" href="styles.css">
    <script src="js/app.js" defer></script>
</head>
<body>

    <header>
        <h1>Panadería Santa Rosa</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="index.html#productos">Productos</a>
            <a href="pedidos.html">Pedidos</a>
        </nav>
    </header>

    <main>
        <section class="formulario-contenedor">
            <h2>Formulario de pedidos</h2>

            <p>Completa tus datos para registrar tu pedido.</p>

            <form action="#" novalidate>

                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre"
                    required aria-describedby="error-nombre">
                <p class="error" id="error-nombre"></p>

                <label for="celular">Número de celular:</label>
                <input type="tel" id="celular" name="celular"
                    required aria-describedby="error-celular">
                <p class="error" id="error-celular"></p>

                <label for="producto">Selecciona un producto:</label>
                <select id="producto" name="producto"
                    required aria-describedby="error-producto">
                    <option value="">Seleccionar producto</option>
                    <option value="Pan de yema">Pan de yema</option>
                    <option value="Pan francés">Pan francés</option>
                    <option value="Chancay" disabled>Chancay - Agotado</option>
                    <option value="Torta de chocolate">Torta de chocolate</option>
                </select>
                <p class="error" id="error-producto"></p>

                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" name="cantidad"
                    min="1" max="100" required
                    aria-describedby="error-cantidad">
                <p class="error" id="error-cantidad"></p>

                <label for="fecha">Fecha de recojo:</label>
                <input type="date" id="fecha" name="fecha"
                    required aria-describedby="error-fecha">
                <p class="error" id="error-fecha"></p>

                <label for="indicaciones">Indicaciones adicionales:</label>
                <textarea id="indicaciones" name="indicaciones"
                    maxlength="200" rows="4"></textarea>

                <p id="contador">Te quedan 200 caracteres.</p>

                <div class="consentimiento">
                    <input type="checkbox" id="consentimiento"
                        name="consentimiento"
                        aria-describedby="error-consentimiento">

                    <label for="consentimiento">
                        Autorizo el uso de mis datos para atender mi pedido.
                    </label>
                </div>

                <p class="error" id="error-consentimiento"></p>

                <div id="estado" role="status"></div>

                <button type="submit">Enviar pedido</button>

            </form>

            <p class="volver">
                <a href="index.html">Volver al inicio</a>
            </p>
        </section>
    </main>

    <footer>
        <p>Panadería Santa Rosa | Guía práctica 3</p>
    </footer>

</body>
</html>
